########################################################################################
# "mtls" profile -- talk to OBP-API over mutual TLS.
#
# Compose it with the other stack profiles, last one wins:
#   --spring.profiles.active=keycloak,mtls,local
#
# Contains ONLY the transport delta from application.properties: https, plus the client
# certificate. Nothing about which OIDC provider is in use (see the "keycloak" profile).
# Tracked in git: the stores below are committed dev certificates, not secrets.
#
# Requires OBP-API to be running with its dev mTLS termination enabled:
#   ./flushall_fast_build_and_run.sh --mtls        (in the OBP-API repo)
# For a plain-HTTP OBP-API, simply do not activate this profile.
#
# HOW TO OVERRIDE ANY OF THESE
# ----------------------------
# Values are plain, not ${VAR:default} placeholders: Spring already maps an environment
# variable onto each property by uppercasing it and turning dots into underscores, so a
# placeholder repeating that same name would add nothing. All of these work, highest
# precedence first:
#
#   --mtls.keyStore.path=file:///path/mine.jks    command line
#   -Dmtls.keyStore.path=file:///path/mine.jks    system property
#   MTLS_KEYSTORE_PATH=file:///path/mine.jks      environment (likewise OBP_BASE_URL,
#                                                 MTLS_KEYSTORE_PASSWORD, MTLS_KEYSTORE_ALIAS,
#                                                 MTLS_TRUSTSTORE_PATH, MTLS_TRUSTSTORE_PASSWORD)
#   mtls.keyStore.path=...                        in application-local.properties
#
# NOTE THE ORDERING: an environment variable BEATS application-local.properties. "local
# wins" is only true among files, so a stale export in your shell silently overrides what
# you put in your local profile.
########################################################################################

obp.base_url=https://localhost:8080
## endpoint.path.prefix is NOT repeated here: application.properties derives it from
## obp.base_url, and that placeholder re-resolves against this overridden value.

## classpath: so this works on any machine -- these stores are committed under
## src/main/resources/cert. Absolute file:/// paths or http(s):// URLs also work.
## keyStore  = this app's client certificate, presented during the TLS handshake;
##             OBP-API's truststore must trust its issuer.
## trustStore= the CAs this app accepts for OBP-API's server certificate.
## Clearing either path disables mTLS and falls back to a plain HTTP client.
## Both stores are generated by ./scripts/generate_dev_certs.sh, which has OBP-API's development
## CA sign a keypair generated here. Regenerate after OBP-API regenerates its set.
mtls.keyStore.path=classpath:cert/hola-client.p12
mtls.keyStore.password=123456
mtls.keyStore.alias=hola-client
mtls.trustStore.path=classpath:cert/hola-truststore.p12
mtls.trustStore.password=123456
