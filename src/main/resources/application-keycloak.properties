########################################################################################
# "keycloak" profile -- use Keycloak as the OIDC provider instead of OBP-OIDC.
#
# Compose it with the other stack profiles, last one wins:
#   --spring.profiles.active=keycloak,mtls,local
#
# Contains ONLY the identity-provider delta from application.properties. Nothing about
# transport (see the "mtls" profile) and nothing machine-specific (see "local").
# Tracked in git: no secrets, no per-developer values.
#
# The discovery document is fetched EAGERLY at startup, so Keycloak must be running
# before this app starts; if it is not, the app refuses to boot and prints the URL.
#
# HARD REQUIREMENT: oauth2.public_url must match OBP-API's own Keycloak configuration
# (oauth2.keycloak.host, oauth2.keycloak.well_known, and the entry in oauth2.jwk_set.url).
# Otherwise OBP-API cannot validate the tokens this app obtains and answers 401.
#
# The port below is a reference, not a convention -- override it in application-local.properties:
#   oauth2.public_url=http://localhost:7787/realms/master
########################################################################################

oauth2.public_url=${KEYCLOAK_PUBLIC_URL:http://localhost:7070/realms/master}
oauth2.client_id=${KEYCLOAK_CLIENT_ID:open-bank-project}

## Overrides the client secret committed in application.properties. Deliberately empty:
## set it in application-local.properties or export KEYCLOAK_CLIENT_SECRET. Leaving this
## line out entirely would silently fall back to that committed secret and fail against
## Keycloak with a confusing "invalid_client".
oauth2.client_secret=${KEYCLOAK_CLIENT_SECRET:}

## Must be registered as a valid redirect URI on the Keycloak client. Follows server.port,
## so overriding the port in "local" keeps this consistent automatically.
oauth2.redirect_uri=${HOLA_REDIRECT_URI:http://localhost:${server.port}/main.html}
