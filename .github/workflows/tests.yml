name: tests

on:
  pull_request:
  push:
    branches:
    - develop

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run the tests, including the OBP-API contract and the v5.1.0 version floor
        run: mvn -B test
